# ============================================================================
# 靶机 Nginx 配置片段 —— DDoS 演示日志格式
# 作用: 1) 定义带 X-Forwarded-For 的 ddos 日志格式（agent.py 的 nginx 解析依赖该格式）
#       2) access_log 写入 /var/log/nginx/access.log ddos
# 用法: 本文件内容需放入 /etc/nginx/nginx.conf 的 http {} 块内（只含指令，不能含 server {}）。
#       2_setup_target.sh 会自动检查并插入；手工插入后执行:
#         nginx -t && systemctl reload nginx
# 校验: curl -I http://192.168.1.137/  ;  tail -n 1 /var/log/nginx/access.log 应形如:
#        192.168.1.130 - - [09/Nov/2026:20:40:00 +0800] "HEAD / HTTP/1.1" 200 0 "-" "curl/7.29.0" "-"
# ============================================================================

# 与 agent.py 中 LOG_RE 严格对应（9 个字段，最后一个是 X-Forwarded-For）
log_format ddos '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
access_log /var/log/nginx/access.log ddos;
