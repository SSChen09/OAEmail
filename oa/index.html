<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ddzt.old 协同办公 OA</title>
<link rel="stylesheet" href="static/style.css?v=20261113g">
</head>
<body>

<!-- ============ 登录页（服务端邮箱账号认证） ============ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-logo">🏢</div>
    <h1 class="login-title">ddzt.old 协同办公 OA</h1>
    <p class="login-sub">内网协同办公平台</p>
    <form id="login-form" autocomplete="off">
      <div class="form-field">
        <label for="login-user">邮箱账号</label>
        <input id="login-user" type="text" placeholder="例如：eva@ddzt.old" autocomplete="username" inputmode="email">
      </div>
      <div class="form-field">
        <label for="login-pass">密码</label>
        <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="login-tip">🔐 请使用邮箱账号登录（如 eva@ddzt.old）</p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-logo">🏢</span>
      <div class="brand-text">
        <div class="brand-name">ddzt.old</div>
        <div class="brand-sub">协同办公 OA</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <a href="#/dashboard" class="nav-item" data-route="dashboard"><span class="nav-icon">📊</span>工作台</a>
      <a href="#/notices" class="nav-item" data-route="notices"><span class="nav-icon">📢</span>公告通知</a>
      <a href="#/approvals" class="nav-item" data-route="approvals"><span class="nav-icon">✅</span>流程审批</a>
      <a href="#/hr" class="nav-item" data-route="hr"><span class="nav-icon">👥</span>人事管理</a>
      <a href="#/schedule" class="nav-item" data-route="schedule"><span class="nav-icon">📅</span>日程安排</a>
      <a href="#/docs" class="nav-item" data-route="docs"><span class="nav-icon">📁</span>文档中心</a>
      <a href="#/contacts" class="nav-item" data-route="contacts"><span class="nav-icon">📇</span>通讯录</a>
      <a href="#/mail" class="nav-item" data-route="mail"><span class="nav-icon">✉️</span>邮件</a>
      <a href="#/security" class="nav-item" data-route="security"><span class="nav-icon">🛡️</span>安全防护</a>
      <a href="#/settings" class="nav-item" data-route="settings"><span class="nav-icon">⚙️</span>系统设置</a>
    </nav>
    <div class="sidebar-foot">内网演练环境 · v1.0</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">工作台</div>
      <div class="topbar-right">
        <span class="topbar-user">👤 当前用户：<strong id="current-user">—</strong><span id="role-tag" class="role-tag role-user">只读用户</span></span>
        <button id="logout-btn" class="btn btn-ghost">🚪 退出登录</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- ============ 通用弹窗 ============ -->
<div id="modal-root" class="modal-root hidden">
  <div class="modal-mask" id="modal-mask"></div>
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="modal-close" id="modal-close" type="button">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ============ Toast 容器 ============ -->
<div id="toast-box" class="toast-box"></div>

<script src="static/app.js?v=20261113g"></script>
</body>
</html>
